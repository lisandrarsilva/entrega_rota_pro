<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrega Rota Pro 2.0</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#e5e9f0;--brand:#1769e0;--brand2:#0f56bd;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--shadow:0 10px 30px rgba(21,34,56,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit} button{cursor:pointer;border:0}.app{min-height:100vh;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:1000}
.logo{font-weight:800;font-size:19px}.logo span{color:var(--brand)}.top-actions{margin-left:auto;display:flex;gap:8px}
.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--ink);font-weight:650}.btn:hover{background:#f7f9fc}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.danger{color:var(--danger)}
.main{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:18px;flex:1}
.left,.right{min-width:0}.map-card,.panel,.stats{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.map-card{overflow:hidden;min-height:calc(100vh - 100px);display:flex;flex-direction:column}.map-toolbar{padding:12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}#map{height:calc(100vh - 205px);min-height:520px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:12px;overflow:hidden}.stat{padding:13px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}
.panel{padding:14px;margin-bottom:12px}.panel h3{margin:0 0 10px;font-size:15px}.import-zone{border:2px dashed #cbd5e1;border-radius:14px;padding:22px;text-align:center;background:#f8fbff}.import-zone.drag{border-color:var(--brand);background:#eef6ff}.import-zone strong{display:block;font-size:16px;margin-bottom:6px}.muted{color:var(--muted);font-size:13px}
.file-row{display:flex;gap:8px;align-items:center;margin-top:10px}.file-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.route-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.route-head h2{font-size:17px;margin:0}.route-head .count{margin-left:auto;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 310px);overflow:auto;padding-right:3px}.stop{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:start}.stop.dragging{opacity:.45}.stop.done{background:#f0fdf4;border-color:#bbf7d0}.stop.problem{background:#fff7f7;border-color:#fecaca}.num{width:30px;height:30px;border-radius:50%;background:#edf4ff;color:var(--brand);display:grid;place-items:center;font-weight:800}.stop-main{min-width:0}.stop-main b{display:block;line-height:1.25}.address{font-size:13px;color:#303a4c;margin-top:3px}.seq{font-size:11px;color:var(--muted);margin-top:5px}.stop-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.mini{padding:6px 8px;border-radius:8px;background:#f4f6f9;border:1px solid var(--line);font-size:12px}.mini:hover{background:#eaf0f8}.status{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#f3f4f6;color:#64748b}.status.done{background:#dcfce7;color:#15803d}.status.problem{background:#fee2e2;color:#b91c1c}
.empty{padding:35px 15px;text-align:center;color:var(--muted)}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:750}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}.modal.open{display:flex}.modal-box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-box h2{margin:0 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{border:1px solid var(--line);padding:9px;border-radius:9px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:4000}.toast.show{display:block}
@media(max-width:1050px){.main{grid-template-columns:1fr}.map-card{min-height:500px}#map{height:55vh;min-height:420px}.list{max-height:none}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat{border-bottom:1px solid var(--line)}}
@media(max-width:600px){.top{padding:0 12px}.main{padding:10px}.top-actions .btn{padding:7px 9px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.stop{grid-template-columns:28px 1fr}.stop-actions{grid-column:2;justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">Entrega <span>Rota Pro</span> <span style="font-size:11px;color:#94a3b8">2.0</span></div>
  <div class="top-actions">
    <button class="btn" id="btnLocate">📍 Minha localização</button>
    <button class="btn primary" id="btnImportTop">📥 Importar</button>
    <button class="btn ok" id="btnExportTop">📤 Exportar</button>
  </div>
</header>
<main class="main">
<section class="left">
  <div class="stats">
    <div class="stat"><b id="statStops">0</b><small>paradas</small></div>
    <div class="stat"><b id="statPackages">0</b><small>pacotes/linhas</small></div>
    <div class="stat"><b id="statDone">0</b><small>entregues</small></div>
    <div class="stat"><b id="statDistance">—</b><small>distância estimada</small></div>
  </div>
  <div class="map-card">
    <div class="map-toolbar">
      <button class="btn primary" id="btnOptimize">⚡ Otimizar rota</button>
      <button class="btn" id="btnRoadRoute">🛣️ Calcular trajeto</button>
      <button class="btn" id="btnReset">↩️ Restaurar ordem</button>
      <button class="btn" id="btnFit">🔎 Ver tudo</button>
    </div>
    <div id="map"></div>
  </div>
</section>
<section class="right">
  <div class="panel">
    <div class="import-zone" id="dropZone">
      <strong>📦 Importe sua planilha da Shopee</strong>
      <div class="muted">Arraste .xlsx/.xls/.csv aqui ou selecione um arquivo.</div>
      <div style="margin-top:12px"><button class="btn primary" id="btnChoose">Selecionar planilha</button></div>
      <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>
      <div class="file-row" id="fileInfo" style="display:none"><span class="badge">OK</span><span class="file-name" id="fileName"></span></div>
    </div>
  </div>
  <div class="panel">
    <div class="controls">
      <input id="search" placeholder="🔎 Buscar endereço, Sequence, SPX TN...">
      <select id="filter"><option value="all">Todas</option><option value="pending">Pendentes</option><option value="done">Entregues</option><option value="problem">Problemas</option></select>
    </div>
  </div>
  <div class="panel">
    <div class="route-head"><h2>Rota</h2><span class="count" id="routeCount">0 paradas</span></div>
    <div class="list" id="stopList"><div class="empty">Importe uma planilha para começar.</div></div>
  </div>
</section>
</main>
</div>

<div class="modal" id="detailModal"><div class="modal-box">
  <h2 id="modalTitle">Detalhes da parada</h2>
  <div id="modalBody"></div>
  <div class="modal-foot"><button class="btn" id="modalClose">Fechar</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const state={rows:[],groups:[],originalGroups:[],fileName:'',headers:[],lat:null,lng:null,map:null,markers:[],routeLine:null,dragId:null,geocodeCache:{},start:null};

const STREET_TYPES={
  r:'rua','r.':'rua','rua':'rua','av':'avenida','av.':'avenida','aven':'avenida','avenida':'avenida',
  rod:'rodovia','rod.':'rodovia','rodovia':'rodovia','tv':'travessa','tv.':'travessa','trav':'travessa','travessa':'travessa',
  al:'alameda','al.':'alameda','alameda':'alameda','pç':'praca','pc':'praca','praca':'praca','praça':'praca',
  est:'estrada','est.':'estrada','estrada':'estrada','vl':'viela','viela':'viela','lgo':'largo','largo':'largo'
};
const COMMON_ABBR={q:'quadra',qd:'quadra',bl:'bloco',ap:'apartamento',apto:'apartamento',c:'casa',cs:'casa',sl:'sala',lj:'loja'};

function norm(s){
  return String(s??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\\s]/g,' ').replace(/\\s+/g,' ').trim();
}
function tokens(s){return norm(s).split(' ').filter(Boolean)}
function expandType(t){return STREET_TYPES[t]||t}
function streetEquivalent(a,b){
  let A=tokens(a),B=tokens(b);
  if(!A.length||!B.length)return false;
  A[0]=expandType(A[0]); B[0]=expandType(B[0]);
  if(A[0]!==B[0]) return false;
  A=A.slice(1); B=B.slice(1);
  let i=0,j=0;
  while(i<A.length && j<B.length){
    const x=A[i],y=B[j];
    if(x===y){i++;j++;continue}
    if(x.length===1 && y.startsWith(x)){i++;j++;continue}
    if(y.length===1 && x.startsWith(y)){i++;j++;continue}
    return false;
  }
  return i===A.length && j===B.length;
}
function extractAddress(addr){
  const raw=String(addr??'').trim();
  const m=raw.match(/(?:^|\\s)(\\d+[A-Za-z]?)(?=\\s|,|$)/);
  if(!m)return {street:raw,number:'',complement:'',base:raw};
  const idx=m.index + (m[0].startsWith(' ')?1:0);
  const street=raw.slice(0,idx).replace(/[ ,]+$/,'').trim();
  const number=m[1];
  let rest=raw.slice(idx+m[0].length).replace(/^\\s*,?\\s*/,'').trim();
  const base=(street+', '+number).replace(/\\s+/g,' ').trim();
  return {street,number,complement:rest,base};
}
function findCol(headers, names){
  const hn=headers.map(h=>norm(h));
  for(const n of names){const i=hn.indexOf(norm(n)); if(i>=0)return headers[i]}
  return null;
}
function uniqueVals(vals){
  const out=[]; const seen=new Set();
  for(const v of vals){const s=String(v??'').trim(); if(!s)continue; const k=norm(s); if(!seen.has(k)){seen.add(k);out.push(s)}}
  return out;
}
function seqSort(vals){
  const u=uniqueVals(vals);
  u.sort((a,b)=>{
    const na=parseFloat(String(a).replace(',','.')), nb=parseFloat(String(b).replace(',','.'));
    if(Number.isFinite(na)&&Number.isFinite(nb))return na-nb;
    return String(a).localeCompare(String(b),'pt-BR',{numeric:true});
  });
  return u.join(', ');
}
function makeGroup(rowIndices){
  const rows=rowIndices.map(i=>state.rows[i]);
  const addrCol=findCol(state.headers,['Destination Address','Destination address','Address','Endereço']);
  const seqCol=findCol(state.headers,['Sequence','Sequência']);
  const bairroCol=findCol(state.headers,['Bairro','Neighborhood']);
  const cityCol=findCol(state.headers,['City','Cidade']);
  const first=rows[0];
  const parsed=rows.map(r=>extractAddress(r[addrCol]));
  let complements=[];
  parsed.forEach(p=>{if(p.complement)complements.push(p.complement)});
  const base=parsed.find(p=>p.base)?.base || first[addrCol];
  const out={...first,__indices:rowIndices,__rows:rows,__base:base,__complements:uniqueVals(complements),status:'pending'};
  for(const h of state.headers){
    if(h===addrCol){
      out[h]=base+(out.__complements.length? ', '+out.__complements.join('; '):'');
    }else if(h===seqCol){
      out[h]=seqSort(rows.map(r=>r[h]));
    }else if(h===bairroCol || h===cityCol){
      out[h]=uniqueVals(rows.map(r=>r[h])).join(' | ');
    }else if(h.toLowerCase()==='latitude' || h.toLowerCase()==='longitude'){
      const nums=rows.map(r=>Number(r[h])).filter(Number.isFinite);
      out[h]=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length):first[h];
    }else{
      const vals=uniqueVals(rows.map(r=>r[h]));
      out[h]=vals.join(' | ');
    }
  }
  out.lat=Number(out[findCol(state.headers,['Latitude','lat'])]);
  out.lng=Number(out[findCol(state.headers,['Longitude','lng','lon'])]);
  return out;
}
function canGroup(g,row){
  const addrCol=findCol(state.headers,['Destination Address','Destination address','Address','Endereço']);
  const bairroCol=findCol(state.headers,['Bairro','Neighborhood']);
  const cityCol=findCol(state.headers,['City','Cidade']);
  const p=extractAddress(row[addrCol]);
  const gp=extractAddress(g.__rows[0][addrCol]);
  if(!p.number||!gp.number||norm(p.number)!==norm(gp.number))return false;
  if(!streetEquivalent(p.street,gp.street))return false;
  if(bairroCol && norm(row[bairroCol])!==norm(g.__rows[0][bairroCol]))return false;
  if(cityCol && norm(row[cityCol])!==norm(g.__rows[0][cityCol]))return false;
  return true;
}
function buildGroups(){
  const groups=[];
  state.rows.forEach((row,i)=>{
    let found=null;
    for(const g of groups){if(canGroup(g,row)){found=g;break}}
    if(found)found.__indices.push(i),found.__rows.push(row);
    else groups.push({__indices:[i],__rows:[row],__base:'',__complements:[],status:'pending'});
  });
  state.groups=groups.map(g=>makeGroup(g.__indices));
  state.originalGroups=state.groups.map(g=>({...g,__indices:[...g.__indices],__rows:[...g.__rows]}));
}
function render(){
  updateStats(); renderList(); renderMap();
}
function updateStats(){
  document.getElementById('statStops').textContent=state.groups.length;
  document.getElementById('statPackages').textContent=state.rows.length;
  document.getElementById('statDone').textContent=state.groups.filter(g=>g.status==='done').length;
  document.getElementById('routeCount').textContent=state.groups.length+' paradas';
}
function matches(g){
  const q=norm(document.getElementById('search').value);
  const f=document.getElementById('filter').value;
  if(f!=='all' && g.status!==f)return false;
  if(!q)return true;
  return state.headers.some(h=>norm(g[h]).includes(q));
}
function renderList(){
  const el=document.getElementById('stopList'); el.innerHTML='';
  const visible=state.groups.filter(matches);
  if(!visible.length){el.innerHTML='<div class="empty">Nenhuma parada encontrada.</div>';return}
  visible.forEach((g)=>{
    const idx=state.groups.indexOf(g);
    const d=document.createElement('div'); d.className='stop '+(g.status==='done'?'done ':'')+(g.status==='problem'?'problem':'');
    d.draggable=true; d.dataset.idx=idx;
    const seqCol=findCol(state.headers,['Sequence','Sequência']);
    const addrCol=findCol(state.headers,['Destination Address','Destination address','Address','Endereço']);
    d.innerHTML=`<div class="num">${idx+1}</div><div class="stop-main"><b>${esc(g[addrCol]||'')}</b><div class="address">${esc(g[findCol(state.headers,['Bairro','Neighborhood'])]||'')} ${g[findCol(state.headers,['City','Cidade'])]?'• '+esc(g[findCol(state.headers,['City','Cidade'])]):''}</div><div class="seq">Sequence: ${esc(g[seqCol]||'—')} ${g.__rows.length>1?'<span class="badge">agrupado '+g.__rows.length+' linhas</span>':''}</div></div><div class="stop-actions"><span class="status ${g.status}">${g.status==='done'?'ENTREGUE':g.status==='problem'?'PROBLEMA':'PENDENTE'}</span><button class="mini" data-act="detail">Detalhes</button><button class="mini" data-act="nav">🗺️</button><button class="mini" data-act="done">${g.status==='done'?'↩️':'✅'}</button><button class="mini" data-act="end">⏭️</button></div>`;
    d.addEventListener('dragstart',()=>state.dragId=idx);
    d.addEventListener('dragover',e=>e.preventDefault());
    d.addEventListener('drop',e=>{e.preventDefault();const target=idx;const from=state.dragId;if(from===null||from===target)return;const [m]=state.groups.splice(from,1);state.groups.splice(target,0,m);state.dragId=null;save();render();toast('Ordem alterada.')});
    d.addEventListener('click',e=>{
      const act=e.target.dataset.act;if(!act)return;
      if(act==='detail')openDetail(g);
      if(act==='nav')navigate(g);
      if(act==='done'){g.status=g.status==='done'?'pending':'done';save();render()}
      if(act==='end'){const [m]=state.groups.splice(idx,1);state.groups.push(m);save();render();toast('Parada enviada para o final.')}
    });
    el.appendChild(d);
  });
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initMap(){
  state.map=L.map('map').setView([-19.9,-44.9],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(state.map);
}
function renderMap(){
  if(!state.map)return;
  state.markers.forEach(m=>m.remove());state.markers=[];
  if(state.routeLine){state.routeLine.remove();state.routeLine=null}
  const pts=[];
  state.groups.forEach((g,i)=>{
    if(Number.isFinite(g.lat)&&Number.isFinite(g.lng)){
      const m=L.marker([g.lat,g.lng]).addTo(state.map);
      const addrCol=findCol(state.headers,['Destination Address','Destination address','Address','Endereço']);
      m.bindPopup(`<b>${i+1}. ${esc(g[addrCol])}</b><br>Sequence: ${esc(g[findCol(state.headers,['Sequence','Sequência'])]||'—')}<br><button onclick="window.appDetail(${i})">Detalhes</button>`);
      state.markers.push(m);pts.push([g.lat,g.lng]);
    }
  });
  if(state.start && Number.isFinite(state.start.lat)){const m=L.marker([state.start.lat,state.start.lng],{title:'Início'}).addTo(state.map);m.bindPopup('📍 Início da rota');state.markers.push(m);pts.push([state.start.lat,state.start.lng])}
  if(pts.length)state.map.fitBounds(pts,{padding:[30,30]});
}
window.appDetail=i=>openDetail(state.groups[i]);
function openDetail(g){
  const addrCol=findCol(state.headers,['Destination Address','Destination address','Address','Endereço']);
  const seqCol=findCol(state.headers,['Sequence','Sequência']);
  const lines=state.headers.map(h=>`<tr><td style="font-weight:700;color:#64748b;padding:6px">${esc(h)}</td><td style="padding:6px">${esc(g[h])}</td></tr>`).join('');
  document.getElementById('modalTitle').textContent='Parada • '+g[seqCol];
  document.getElementById('modalBody').innerHTML=`<p><b>${esc(g[addrCol])}</b></p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse">${lines}</table></div>`;
  document.getElementById('detailModal').classList.add('open');
}
function navigate(g){
  if(!Number.isFinite(g.lat)||!Number.isFinite(g.lng)){toast('Esta parada não tem coordenadas.');return}
  const url=`https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}`;
  window.open(url,'_blank');
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function importFile(file){
  try{
    const data=await file.arrayBuffer(); let wb;
    if(file.name.toLowerCase().endsWith('.csv'))wb=XLSX.read(new TextDecoder().decode(data),{type:'string'});
    else wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const arr=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!arr.length)throw new Error('A planilha está vazia.');
    state.rows=arr;state.headers=Object.keys(arr[0]);state.fileName=file.name;
    buildGroups(); state.start=null;
    document.getElementById('fileInfo').style.display='flex';document.getElementById('fileName').textContent=file.name;
    render();toast(`Importado: ${arr.length} linhas → ${state.groups.length} paradas.`);
  }catch(e){alert('Não foi possível importar: '+e.message)}
}
async function optimize(){
  if(!state.groups.length)return toast('Importe uma planilha primeiro.');
  const valid=state.groups.filter(g=>Number.isFinite(g.lat)&&Number.isFinite(g.lng));
  if(valid.length<2)return toast('São necessárias pelo menos 2 paradas com Latitude/Longitude.');
  const start=state.start || {lat:valid[0].lat,lng:valid[0].lng};
  let remaining=state.groups.slice(), ordered=[];
  let cur=start;
  while(remaining.length){
    let best=0,bestD=Infinity;
    remaining.forEach((g,i)=>{if(!Number.isFinite(g.lat))return;const d=haversine(cur.lat,cur.lng,g.lat,g.lng);if(d<bestD){bestD=d;best=i}});
    const g=remaining.splice(best,1)[0];ordered.push(g);cur={lat:g.lat,lng:g.lng};
  }
  state.groups=ordered;save();render();toast('Rota otimizada por proximidade. Use "Calcular trajeto" para desenhar as ruas.');
}
async function roadRoute(){
  if(state.groups.length<2)return toast('Importe e tenha pelo menos 2 paradas.');
  const pts=state.groups.filter(g=>Number.isFinite(g.lat)&&Number.isFinite(g.lng));
  if(pts.length<2)return toast('Não há coordenadas suficientes.');
  try{
    const coords=pts.map(g=>`${g.lng},${g.lat}`).join(';');
    const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
    const r=await fetch(url);const j=await r.json();if(!j.routes?.[0])throw new Error();
    if(state.routeLine)state.routeLine.remove();
    state.routeLine=L.geoJSON(j.routes[0].geometry,{style:{weight:5,opacity:.75}}).addTo(state.map);
    const km=j.routes[0].distance/1000;document.getElementById('statDistance').textContent=km.toFixed(1)+' km';
    state.map.fitBounds(state.routeLine.getBounds(),{padding:[25,25]});
    toast(`Trajeto calculado: ${km.toFixed(1)} km • ${(j.routes[0].duration/3600).toFixed(1)} h estimadas.`);
  }catch(e){toast('Não foi possível calcular o trajeto agora. Tente novamente.')}
}
function haversine(a,b,c,d){const R=6371,rad=Math.PI/180,x=(c-a)*rad,y=(d-b)*rad;const q=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function resetOrder(){state.groups=state.originalGroups.map(g=>({...g,__indices:[...g.__indices],__rows:[...g.__rows]}));save();render();toast('Ordem original restaurada.')}
function save(){try{localStorage.setItem('erp2',JSON.stringify({groups:state.groups.map(g=>({...g,__rows:undefined})),fileName:state.fileName}))}catch(e){}}
function exportFile(){
  if(!state.groups.length)return toast('Nada para exportar.');
  const out=state.groups.map(g=>{const o={};state.headers.forEach(h=>o[h]=g[h]);return o});
  const ws=XLSX.utils.json_to_sheet(out,{header:state.headers});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rota Agrupada');
  const name=state.fileName.replace(/\.[^.]+$/,'');XLSX.writeFile(wb,`Grup_${name}.xlsx`);
  toast('Excel exportado.');
}
function useLocation(){
  if(!navigator.geolocation)return toast('Seu navegador não oferece geolocalização.');
  navigator.geolocation.getCurrentPosition(p=>{state.start={lat:p.coords.latitude,lng:p.coords.longitude};renderMap();toast('Localização definida como início da rota.')},()=>toast('Não foi possível obter sua localização.'));
}
document.getElementById('btnChoose').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('btnImportTop').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0])};
document.getElementById('btnExportTop').onclick=exportFile;
document.getElementById('btnOptimize').onclick=optimize;
document.getElementById('btnRoadRoute').onclick=roadRoute;
document.getElementById('btnReset').onclick=resetOrder;
document.getElementById('btnLocate').onclick=useLocation;
document.getElementById('btnFit').onclick=()=>{const pts=state.groups.filter(g=>Number.isFinite(g.lat)).map(g=>[g.lat,g.lng]);if(pts.length)state.map.fitBounds(pts,{padding:[30,30]})};
document.getElementById('search').oninput=renderList;document.getElementById('filter').onchange=renderList;
document.getElementById('modalClose').onclick=()=>document.getElementById('detailModal').classList.remove('open');
document.getElementById('detailModal').onclick=e=>{if(e.target.id==='detailModal')e.currentTarget.classList.remove('open')};
const dz=document.getElementById('dropZone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)importFile(f)});
initMap();
</script>
